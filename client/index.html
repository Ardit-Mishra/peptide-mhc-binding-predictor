<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!--
      This document had no <title> at all, so every browser tab, bookmark and
      shared link showed the bare URL. It is the first thing anyone sees and the
      last thing anyone thinks to check.

      It also linked 25 Google Font families in one blocking stylesheet -- a
      leftover from a template. Not one of them is referenced anywhere in
      client/src: the only mention of Inter is a comment in index.css recording
      that it was replaced. The two families this app actually uses, Bricolage
      Grotesque and IBM Plex Mono, are imported by index.css, which is where the
      design system that chose them lives. The preconnects stay, because that
      import still resolves to the same two hosts.
    -->
    <title>Peptide–MHC Binding Predictor</title>
    <meta
      name="description"
      content="Predict peptide–MHC class I binding across 129 HLA alleles in your browser. Gradient-boosted trees trained on MHCflurry-curated public measurements, held-out ROC-AUC 0.919, with the split-difficulty ladder published alongside it."
    />
    <meta name="color-scheme" content="dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Peptide–MHC Binding Predictor" />
    <meta
      property="og:description"
      content="Peptide–MHC class I binding prediction for 129 HLA alleles, running locally in the browser. Held-out ROC-AUC 0.919, allele-held-out 0.842 — both reported."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
